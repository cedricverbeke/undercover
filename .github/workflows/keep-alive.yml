name: Supabase Keep-Alive (Undercover)

on:
  schedule:
    # S'exécute tous les 3 jours à minuit UTC pour éviter la mise en veille
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Purchases Table
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # On interroge directement l'API PostgREST de la table purchases (limité à 1 résultat)
          FULL_URL="${SUPABASE_URL}/rest/v1/purchases?select=id&limit=1"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "$FULL_URL" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Code de retour HTTP : $RESPONSE"

          # Si le serveur répond par une erreur critique (5xx), on alerte
          if [ "$RESPONSE" -ge 500 ]; then
            echo "Erreur serveur critique lors du ping Supabase."
            exit 1
          else
            echo "Base de données Undercover réveillée avec succès (Code $RESPONSE) !"
          fi